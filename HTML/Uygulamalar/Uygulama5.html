<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hemen Üye Ol</title>
  </head>
  <body>
    <h1>Lütfen Formu Eksiksiz Doldurunuz.</h1>
    <hr />
    <h2>Hesap Bilgileriniz</h2>
    <table>
      <tr>
        <td style="width: 120px">
          <label for="kadi">Kullanıcı Adı:</label>
        </td>
        <td style="width: 50px"></td>
        <td>
          <input type="text" id="kadi" placeholder="kullanıcı adı giriniz" />
        </td>
      </tr>
      <tr>
        <td>
          <label for="eposta"> Eposta:</label>
        </td>
        <td></td>
        <td>
          <input type="email" id="eposta" placeholder="Eposta giriniz" />
        </td>
      </tr>
      <tr>
        <td>
          <label for="şifre">Parola:</label>
        </td>
        <td></td>
        <td>
          <input type="password" id="şifre" placeholder="Parola giriniz" />
        </td>
      </tr>
    </table>
    <h2>Kişisel Bilgileriniz</h2>
    <table>
      <tr>
        <td style="width: 120px">
          <label for="name">Adınız:</label>
        </td>
        <td style="width: 50px"></td>
        <td>
          <input type="text" id="name" placeholder="Adınızı giriniz" />
        </td>
      </tr>
      <tr>
        <td>
          <label for="sname">Soyadınız:</label>
        </td>
        <td style="width: 50px"></td>
        <td>
          <input type="text" id="sname" placeholder="Soyadınızı giriniz" />
        </td>
      </tr>
      <tr>
        <td>
          <label for="Şehir">Şehir:</label>
        </td>
        <td></td>
        <td>
          <select name="" id="Şehir">
            <option value="">Seçiniz</option>
            <option value="06">Ankara</option>
            <option value="34">Istanbul</option>
            <option value="19">Çorum</option>
            <option value="41">Kocaeli</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>
          <label for="cinsiyet">Cinsiyet:</label>
        </td>
        <td></td>
        <td>
          <input type="radio" id="erkek" name="cinsiyet" /> Erkek
          <input type="radio" id="kız" name="cinsiyet" /> Kadın
        </td>
      </tr>
      <tr>
        <td>
          <label for="Hobi">Hobileriniz:</label>
        </td>
        <td></td>
        <td>
          <input type="checkbox" id="sinema" /> Sinema
          <input type="checkbox" id="Gezmek" /> Gezmek
          <input type="checkbox" id="Spor" /> Spor
          <input type="checkbox" id="Kitap" /> Kitap
        </td>
      </tr>
      <tr>
        <td></td>
        <td></td>
        <td><button type="submit">Kaydet</button></td>
      </tr>
    </table>
  </body>
</html>
